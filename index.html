<style>

<script>/* Boneco animado: cinemática directa 2D, vista lateral, virado para a direita.

const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }
const seg=(a,b)=>`M${a[0].toFixed(1)} ${a[1].toFixed(1)}L${b[0].toFixed(1)} ${b[1].toFixed(1)}`;
const poly=pts=>'M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L');

function build(svg,spec){
  svg.setAttribute('viewBox','0 0 200 150');
  const g={};
  const back=el('g',{},svg);
  el('line',{x1:6,y1:142.5,x2:194,y2:142.5,class:'fg-ground'},svg);
  if(spec.eq.some(e=>e.k==='mat')) el('rect',{x:28,y:141,width:144,height:3,rx:1.5,class:'fg-mat'},svg);
  spec.eq.forEach(e=>{
    if(e.k==='door'){ el('line',{x1:e.x+4,y1:4,x2:e.x+4,y2:142,class:'fg-door'},back); el('circle',{cx:e.x,cy:e.y,r:2.6,class:'fg-anchor'},back); }
    if(e.k==='post'){ el('rect',{x:e.x-7,y:e.y-14,width:9,height:142-e.y+14,rx:1.5,class:'fg-post'},back); }
    if(e.k==='box'&&e.x!=null){ el('rect',{x:e.x,y:e.y,width:e.w,height:142-e.y,rx:3,class:'fg-box'},back); }
  });
  g.boxes=spec.eq.filter(e=>e.k==='box'&&e.under).map(e=>({e,r:el('rect',{rx:3,class:'fg-box'},back)}));
  g.bandsFar=spec.eq.filter(e=>e.k==='band'&&e.far).map(e=>({e,p:el('path',{class:'fg-band fg-band-far'},svg)}));
  g.l2=el('path',{class:'fg-far'},svg); g.a2=el('path',{class:'fg-far'},svg);
  g.torso=el('path',{class:'fg-body'},svg);
  g.head=el('circle',{r:HEAD,class:'fg-head'},svg);
  g.l1=el('path',{class:'fg-body'},svg);
  g.bands=spec.eq.filter(e=>e.k==='band'&&!e.far).map(e=>({e,p:el('path',{class:'fg-band'+(e.loop?' fg-band-loop':'')},svg)}));
  g.side=spec.eq.some(e=>e.k==='side')? {p:el('path',{class:'fg-band fg-band-dash'},svg), t:el('text',{class:'fg-label','text-anchor':'end'},svg)}:null;
  if(g.side) g.side.t.textContent='âncora ao lado';
  g.a1=el('path',{class:'fg-body'},svg);
  g.kbs=spec.eq.filter(e=>e.k==='kb'||e.k==='kbhip').map(e=>{ const gg=el('g',{},svg); el('path',{d:'M-5 -1.5 Q-5.5 -9 0 -9 Q5.5 -9 5 -1.5',class:'fg-kb-handle'},gg); el('circle',{cx:0,cy:5,r:7.2,class:'fg-kb'},gg); return {e,gg}; });
  g.dbs=spec.eq.filter(e=>e.k==='db').map(e=>{ const gg=el('g',{},svg); el('rect',{x:-6,y:-1.6,width:12,height:3.2,rx:1.4,class:'fg-db-bar'},gg); el('circle',{cx:0,cy:0,r:4.3,class:'fg-db'},gg); return {e,gg}; });
  return g;
}
function draw(g,j){
  const tor = j.bend ? (()=>{ const m=mul(add(j.p,j.n),.5); const c=add(m,mul(dir(j.ta+90),j.bend*2)); return `M${j.p[0].toFixed(1)} ${j.p[1].toFixed(1)}Q${c[0].toFixed(1)} ${c[1].toFixed(1)} ${j.n[0].toFixed(1)} ${j.n[1].toFixed(1)}`; })() : seg(j.p,j.n);
  g.torso.setAttribute('d',tor);
  g.head.setAttribute('cx',j.hd[0].toFixed(1)); g.head.setAttribute('cy',j.hd[1].toFixed(1));
  g.l1.setAttribute('d',poly([j.p,j.k1,j.f1,j.t1])); g.l2.setAttribute('d',poly([j.p,j.k2,j.f2,j.t2]));
  g.a1.setAttribute('d',poly([j.n,j.e1,j.w1])); g.a2.setAttribute('d',poly([j.n,j.e2,j.w2]));
  const pt=at=>at==='mid'?j.mid:j[at];
  [...g.bands,...g.bandsFar].forEach(({e,p})=>{ const to=pt(e.to);
    if(e.loop){ const a=e.from, o=[to[0],to[1]]; p.setAttribute('d',`M${a[0]} ${a[1]-3}L${o[0].toFixed(1)} ${(o[1]-2).toFixed(1)}M${a[0]} ${a[1]+3}L${o[0].toFixed(1)} ${(o[1]+2).toFixed(1)}`); }
    else p.setAttribute('d',seg(e.from,to)); });
  if(g.side){ const h=j.mid; g.side.p.setAttribute('d',seg(h,[h[0]-30,h[1]+26])); g.side.t.setAttribute('x',(h[0]-30).toFixed(1)); g.side.t.setAttribute('y',(h[1]+38).toFixed(1)); }
  g.kbs.forEach(({e,gg})=>{ let c; if(e.k==='kbhip'){ c=add(j.p,[2,-17]); } else { const h=pt(e.at); c=[h[0],h[1]+8]; } gg.setAttribute('transform',`translate(${c[0].toFixed(1)} ${c[1].toFixed(1)})`); });
  g.dbs.forEach(({e,gg})=>{ const h=pt(e.at); gg.setAttribute('transform',`translate(${h[0].toFixed(1)} ${h[1].toFixed(1)})`); });

}
function poseAt(spec,ms){
  const seq=spec.seq||[0,1]; const n=seq.length; const holds=spec.hold||[0,0]; const d=spec.d||1200;

    if(t<d) return interp(a,b,ease(t/d)); t-=d; }
  return spec.frames[seq[0]];
}
function frameJoints(spec,pose){ return place(fk(pose),spec.anchor); }

const live=new Set();
function mount(svg,id,opts={}){
  const spec=M[id]; if(!spec) return null;
  const g=build(svg,spec);
  const item={svg,spec,g,visible:true,offset:opts.offset||0,still:!!opts.still};
  draw(g,frameJoints(spec,spec.frames[(spec.seq||[0,1])[1]]));
  live.add(item);

}
function unmount(item){ if(!item) return; live.delete(item); item.io&&item.io.disconnect(); }
let reduce=false; try{ reduce=matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
function tick(now){
  live.forEach(it=>{ if(!it.svg.isConnected){ unmount(it); return; } if(!it.visible||it.still) return; if(reduce&&!it.forcePlay) return;
    draw(it.g,frameJoints(it.spec,poseAt(it.spec,now+it.offset))); });
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
window.Figures={mount,unmount,M,poseAt,frameJoints,build,draw,setReduce:v=>reduce=v,isReduced:()=>reduce};
})();

 breath:{n:'Respiração deitado',eq:'none',cues:['Deitado com joelhos dobrados, mãos na barriga.','Inspira pelo nariz 4 s sentindo a barriga e as costelas abrir.','Expira 6 s. Ajuda a baixar a tensão nas costas.'],err:'Respirar só com o peito e os ombros.'}

const DAYS=[

 {wd:'TER',n:'Pernas e glúteos',coach:'Pernas fortes poupam a lombar no dia a dia. Desce no agachamento só até onde as costas ficam direitas; a profundidade vem com as semanas.',

 {wd:'QUA',n:'Barriga e mobilidade',coach:'Dia mais leve para recuperar. Barriga forte, para a coluna, quer dizer resistir ao movimento: não rodar, não dobrar, não arquear. Termina com uma caminhada calma.',
  main:[{id:'deadbug',s:[3,3,4],r:'8 /lado',rest:45,w:60},{id:'pallof',s:[3,3,4],r:'10 /lado',rest:45,w:70},{id:'bridge',s:[3,3,3],r:'15',rest:45},{id:'plank',s:[3,3,4],r:'20–30 s',rest:45,w:30},{id:'carry',s:[3,3,3],r:'30 s /lado',rest:60,w:70},{id:'march',s:[1,1,1],r:'10 min',rest:0,w:600,note:'ou uma caminhada lá fora'}]},
 {wd:'QUI',n:'Tronco superior',coach:'Costas e ombros equilibrados ajudam a postura. Por cada exercício de empurrar há um de puxar. Controla a descida em todos.',
  main:[{id:'pushup',s:[3,3,4],r:'10–12',rest:60},{id:'chestPress',s:[3,4,4],r:'12',rest:60},{id:'bandRow',s:[3,4,4],r:'12',rest:60},{id:'shoulderPress',s:[3,3,4],r:'15',rest:45},{id:'kbRow',s:[3,3,3],r:'10 /lado',rest:60,w:80},{id:'curl',s:[2,3,3],r:'15',rest:45},{id:'triceps',s:[2,3,3],r:'15',rest:45}]},
 {wd:'SEX',n:'Corpo inteiro',coach:'Juntamos tudo. Mantém a técnica até à última rep; prefiro 10 reps perfeitas a 12 tortas. Fim de semana: descanso e caminhadas.',
  main:[{id:'goblet',s:[3,3,4],r:'12',rest:75},{id:'deadlift',s:[3,3,0],r:'12',rest:75,ph:[1,2]},{id:'swing',s:[0,0,4],r:'15',rest:75,ph:[3]},{id:'bandRow',s:[3,3,4],r:'12',rest:60},{id:'chestPress',s:[3,3,4],r:'12',rest:60},{id:'pallof',s:[3,3,3],r:'10 /lado',rest:45,w:70},{id:'carry',s:[3,3,4],r:'30 s /lado',rest:60,w:70}]}
];
const TIPS=['Respira durante o esforço: expira ao fazer força.','Dor ligeira (até 3–4 em 10) durante o treino é aceitável se no dia seguinte estiver igual ou melhor.','Logo a seguir a acordar, evita dobrar a coluna repetidamente; treina pelo menos 1 hora depois de acordares.','Duas reps "em reserva" no fim de cada série chegam nas primeiras semanas.','Passar muito tempo sentado? Levanta-te a cada 30–45 minutos e caminha 2 minutos.','Dormir 7 a 9 horas é parte do treino: é aí que o corpo recupera.','Bebe água ao longo do treino, não só no fim.'];

/* ---------- Estado ---------- */
const KEY='lombar-forte-v1';
let S={log:[],pain:{},sets:{}};
try{ const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw)); }catch(e){}
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} };
const today=()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const phase=()=>{ const n=S.log.length; return n<15?1:n<30?2:3; };
const weekStart=()=>{ const d=new Date(); const k=(d.getDay()+6)%7; d.setDate(d.getDate()-k); d.setHours(0,0,0,0); return d; };
const doneThisWeek=i=>S.log.some(l=>l.day===i && new Date(l.date+'T12:00')>=weekStart());
let cur=Math.min(Math.max((new Date().getDay()+6)%7,0),4);
let open=null; let view='treino';

/* ---------- UI ---------- */
const $=s=>document.querySelector(s);
const h=(tag,attrs={},html)=>{ const e=document.createElement(tag); for(const k in attrs){ if(k==='on') for(const ev in attrs.on) e.addEventListener(ev,attrs.on[ev]); else e.setAttribute(k,attrs[k]); } if(html!=null) e.innerHTML=html; return e; };
const svgEl=()=>document.createElementNS('http://www.w3.org/2000/svg','svg');

function items(day){
  const ph=phase();
  const main=DAYS[day].main.filter(m=>!m.ph||m.ph.includes(ph)).map(m=>Object.assign({},m,{sets:m.s[ph-1]})).filter(m=>m.sets>0);
  return [
    {key:'warm',t:'Aquecimento',list:WARM.map(x=>Object.assign({sets:1},x))},
    {key:'big3',t:'Bloco lombar · McGill Big 3',list:BIG3.map(x=>Object.assign({sets:1},x))},
    {key:'main',t:'Treino principal',list:main},
    {key:'cool',t:'Retorno à calma',list:COOL.map(x=>Object.assign({sets:1},x))}];
}
const mins=it=> it.min!=null? it.min : it.sets*((it.w||45)+(it.rest||0))/60;
const rxText=it=> it.p? it.p : `${it.sets} × ${it.r}`;

function render(){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===view));
  const ph=phase(); $('#phase').textContent=`Fase ${ph} · ${S.log.length} treino${S.log.length===1?'':'s'}`;
  const app=$('#app'); app.innerHTML=''; const v=h('section',{class:'view'}); app.appendChild(v);
  if(view==='treino') renderTreino(v); else if(view==='treinador') renderCoach(v); else if(view==='comida') renderFood(v); else renderGear(v);
}

function renderTreino(v){
  const days=h('div',{class:'days',role:'group','aria-label':'Dias de treino'});
  DAYS.forEach((d,i)=>{ const b=h('button',{class:'day','aria-pressed':i===cur,type:'button',on:{click:()=>{cur=i;open=null;render();}}},
    `<div class="wd">${d.wd}</div><div class="dn">Dia ${i+1}</div><div class="fo">${d.n}</div>${doneThisWeek(i)?'<span class="done" aria-label="feito esta semana">✓</span>':''}`); days.appendChild(b); });
  v.appendChild(days);

  const blocks=items(cur); const total=Math.round(blocks.reduce((a,b)=>a+b.list.reduce((x,it)=>x+mins(it),0),0));
  v.appendChild(h('div',{class:'dayhead'},`<h2>${DAYS[cur].n}</h2><div class="meta">≈ ${total} min</div>`));
  v.appendChild(h('div',{class:'coach'},`<span class="who">Treinador</span><p>${DAYS[cur].coach}</p>`));

  const pv=S.pain[today()]??null;
  const pain=h('div',{class:'pain'});
  pain.innerHTML=`<label for="painIn">Como está a tua lombar hoje? (0 = sem dor, 10 = pior possível)</label>
    <div class="row"><input type="range" id="painIn" min="0" max="10" step="1" value="${pv??2}"><span class="val" id="painV">${pv??'–'}</span></div><div class="msg" id="painM"></div>`;
  v.appendChild(pain);
  const setMsg=val=>{ const m=pain.querySelector('#painM'); if(val==null){ m.className='msg g'; m.textContent='Mexe a barra para registar como estás antes de começar.'; return; }
    if(val<=3){ m.className='msg g'; m.textContent='Treino normal. Pára qualquer exercício que faça a dor subir acima de 4.'; }
    else if(val<=5){ m.className='msg a'; m.textContent='Treino reduzido: faz 2 séries em vez de 3–4, movimentos lentos, e salta o que agravar.'; }
    else { m.className='msg r'; m.textContent='Hoje faz só o aquecimento, o bloco lombar e uma caminhada calma. Se a dor não melhora em 1–2 semanas ou desce pela perna, fala com um médico ou fisioterapeuta.'; }
  };
  setMsg(pv);
  pain.querySelector('#painIn').addEventListener('input',e=>{ const val=+e.target.value; S.pain[today()]=val; save(); pain.querySelector('#painV').textContent=val; setMsg(val);
    v.querySelectorAll('.block[data-k="main"],.block[data-k="cool"]').forEach(b=>b.classList.toggle('dim',val>=6 && b.dataset.k==='main')); });

  let k=0;
  blocks.forEach(bl=>{
    const sec=h('section',{class:'block','data-k':bl.key}); if(bl.key==='main'&&pv>=6) sec.classList.add('dim');
    const bm=Math.round(bl.list.reduce((x,it)=>x+mins(it),0));
    sec.appendChild(h('h3',{},`${bl.t}<span>${bm} min</span>`));
    const list=h('div',{class:'exs'}); sec.appendChild(list);
    bl.list.forEach(it=>{ list.appendChild(exRow(it,bl.key,k++)); });
    v.appendChild(sec);
  });

  const fin=h('div',{class:'finish'});
  const already=S.log.some(l=>l.date===today()&&l.day===cur);
  const btn=h('button',{class:'btn red',type:'button',on:{click:()=>{ if(!already){ S.log.push({date:today(),day:cur}); save(); } render(); }}}, already?'Treino concluído hoje ✓':'Concluir treino');
  fin.appendChild(btn);
  fin.appendChild(h('p',{},`Dica do dia: ${TIPS[(new Date().getDate()+cur)%TIPS.length]}`));
  v.appendChild(fin);
}

function exRow(it,bk,idx){
  const ex=X[it.id]; const e=EQ[ex.eq];
  const sk=`${today()}|${cur}|${bk}|${it.id}`; const done=S.sets[sk]||0;
  const row=h('article',{class:'ex'});
  const id=`ex-${bk}-${it.id}`;
  const head=h('button',{class:'head',type:'button','aria-expanded':open===id,'aria-controls':id+'-d'});
  const th=svgEl(); th.classList.add('thumb'); th.setAttribute('aria-hidden','true');
  head.appendChild(th);
  const info=h('div',{class:'info'},`<div class="nm">${ex.n}</div><div class="rx">${rxText(it)}${it.rest?` <small>· descanso ${it.rest} s</small>`:''}</div>
    <div class="tags">${e[1]?`<span class="tag ${e[1]}">${e[0]}</span>`:`<span class="tag">${e[0]}</span>`}${it.note?`<span class="tag">${it.note}</span>`:''}</div>`);
  head.appendChild(info);
  head.appendChild(h('span',{class:'prog'+(done>=it.sets?' full':'')},`${done}/${it.sets}`));
  head.addEventListener('click',()=>{ open = open===id? null : id; render(); requestAnimationFrame(()=>{ const t=document.getElementById(id+'-d'); if(t) t.scrollIntoView({block:'nearest',behavior:'smooth'}); }); });
  row.appendChild(head);
  Figures.mount(th,it.id,{offset:idx*370});

  if(open===id){
    const d=h('div',{class:'detail',id:id+'-d'});
    const stage=h('div',{class:'stage'}); const big=svgEl(); big.setAttribute('role','img'); big.setAttribute('aria-label','Demonstração animada: '+ex.n); stage.appendChild(big);
    const item=Figures.mount(big,it.id);
    const ctl=h('div',{class:'ctl'});
    const play=h('button',{class:'chip',type:'button'},Figures.isReduced()?'Ver movimento':'Pausar');
    let paused=false; if(Figures.isReduced()) paused=true;
    play.addEventListener('click',()=>{ paused=!paused; item.still=paused; item.forcePlay=!paused; play.textContent=paused?'Ver movimento':'Pausar'; });
    ctl.appendChild(play); stage.appendChild(ctl);
    d.appendChild(stage);
    const txt=h('div',{});
    txt.innerHTML=`<h4>Como fazer</h4><ol>${ex.cues.map(c=>`<li>${c}</li>`).join('')}</ol><div class="warn"><b>Evita:</b> ${ex.err}</div><h4>Séries</h4>`;
    const sets=h('div',{class:'sets'});
    for(let i=1;i<=it.sets;i++){ const b=h('button',{class:'set',type:'button','aria-pressed':i<=done,'aria-label':'Série '+i},String(i));
      b.addEventListener('click',()=>{ const nv = S.sets[sk]===i? i-1 : i; S.sets[sk]=nv; save(); if(nv===i && it.rest && i<it.sets) startTimer(it.rest,`${ex.n} · próxima série ${i+1} de ${it.sets}`); render(); });
      sets.appendChild(b); }
    txt.appendChild(sets);
    if(it.rest) txt.appendChild(h('button',{class:'btn ghost',type:'button',on:{click:()=>startTimer(it.rest,ex.n)}},`Descanso ${it.rest} s`));
    d.appendChild(txt);
    row.appendChild(d);
  }
  return row;
}

/* temporizador */
let tEnd=0,tLen=0,tInt=null,actx=null;
function beep(){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(),g=actx.createGain(); o.frequency.value=880; g.gain.value=.15; o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+.25); }catch(e){} }
function startTimer(sec,label){ tLen=sec; tEnd=Date.now()+sec*1000; $('#tl').textContent='Descanso · '+label; $('#timer').hidden=false; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} clearInterval(tInt); tInt=setInterval(tick,200); tick(); }
function tick(){ const left=Math.max(0,Math.ceil((tEnd-Date.now())/1000)); $('#tt').textContent=left; $('#tbar').style.width=(100*(1-left/tLen))+'%';
  if(left<=0){ clearInterval(tInt); $('#tt').textContent='Vai!'; beep(); setTimeout(()=>{ if(Date.now()>tEnd+2500) $('#timer').hidden=true; },3000); } }
$('#tplus').addEventListener('click',()=>{ tEnd+=15000; tLen+=15; if($('#tt').textContent==='Vai!'){ clearInterval(tInt); tInt=setInterval(tick,200);} tick(); });
$('#tstop').addEventListener('click',()=>{ clearInterval(tInt); $('#timer').hidden=true; });

function renderCoach(v){
  const ph=phase();
  v.appendChild(h('div',{class:'art'},`
  <div class="card"><h2>A tua semana</h2><p>Cinco treinos de segunda a sexta, fim de semana para descansar e caminhar. A quarta-feira é mais leve, para recuperares a meio da semana.</p>
   <div class="week">${['SEG','TER','QUA','QUI','SEX','SÁB','DOM'].map((d,i)=>`<div class="${i<5?'on':''}"><b>${d}</b>${i<5?'Dia '+(i+1):'Caminhar'}</div>`).join('')}</div></div>
  <div class="card"><h2>Como vamos progredir</h2>
   <ul><li><b>Fase 1 (primeiros 15 treinos, cerca de 3 semanas):</b> 3 séries de 10–12, sempre com 2 reps de reserva. O objetivo é técnica e voltar ao hábito.</li>
   <li><b>Fase 2 (treinos 16 a 30):</b> passa a 4 séries nos exercícios principais. Desce mais devagar (3 segundos) para tornar mais difícil sem mais peso.</li>
   <li><b>Fase 3 (a partir do treino 31):</b> entra o kettlebell swing, se o peso morto já estiver sólido e sem dor.</li></ul>
   <p>Estás na <b>fase ${ph}</b>. A app muda as séries sozinha conforme marcas treinos como concluídos. Quando 12 reps ficarem fáceis, passa para 15 antes de pensares em mais peso.</p></div>
  <div class="card"><h2>A dor como guia</h2>
   <p>Mexer-se faz bem às costas. As recomendações clínicas para a dor lombar põem o exercício como primeiro passo, seja fortalecimento, alongamento, aeróbio ou yoga.</p>
   <ul><li>Dor até 3–4 em 10 durante o treino é aceitável, desde que no dia seguinte estejas igual ou melhor.</li>
   <li>Se um exercício faz a dor subir, encurta o movimento ou troca-o por um do bloco lombar.</li>
   <li>Logo depois de acordar, os discos estão mais hidratados: evita dobrar a coluna repetidamente na primeira hora do dia.</li>
   <li>Os três exercícios do bloco lombar (curl-up, prancha lateral e bird dog) são do Dr. Stuart McGill e treinam a resistência dos músculos que estabilizam a coluna. Fá-los todos os dias, mesmo nos de descanso, se quiseres.</li></ul></div>
  <div class="card red"><h2>Quando parar e ir ao médico</h2>
   <ul><li>Dormência ou formigueiro na zona genital ou entre as pernas, ou alterações ao urinar ou evacuar: urgência, no mesmo dia.</li>
   <li>Perda de força numa perna ou pé.</li><li>Dor que desce pela perna abaixo do joelho e não melhora.</li>
   <li>Dor forte à noite que não alivia com nenhuma posição, febre, ou perda de peso sem razão.</li>
   <li>Dor que não melhora nada ao fim de algumas semanas de treino.</li></ul>
   <p>Esta app não substitui uma avaliação. Se as dores são fortes ou antigas, uma consulta com um fisioterapeuta ajuda a afinar o plano.</p></div>
  <div class="card"><h2>Descanso</h2><ul>
   <li>Entre séries: 60–90 s nos exercícios grandes (peso morto, agachamento), 45–60 s nos restantes. O temporizador começa sozinho quando marcas uma série.</li>
   <li>Entre treinos: a ordem dos dias evita trabalhar o mesmo grupo forte em dias seguidos.</li>
   <li>Sono: 7 a 9 horas. Dormir pouco aumenta a sensação de dor e atrasa a recuperação.</li>
   <li>Fim de semana: caminhadas de 20 a 40 minutos contam como recuperação ativa.</li></ul></div>
  <p class="src">Fontes: <a href="https://www.nice.org.uk/guidance/ng59" target="_blank" rel="noopener">NICE NG59, dor lombar e ciática</a> · <a href="https://www.health.harvard.edu/staying-healthy/three-moves-for-better-spine-health" target="_blank" rel="noopener">Harvard Health, "big three" de McGill</a> · <a href="https://www.acefitness.org/resources/pros/expert-articles/7950/the-top-6-exercises-to-reduce-low-back-and-knee-pain/" target="_blank" rel="noopener">ACE, doses do Big 3</a></p>`));
}

function renderGear(v){
